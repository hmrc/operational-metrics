include "backend.conf"

# This is the main configuration file for the application.
# ~~~~~

appName = operational-metrics

# Default http client
play.modules.enabled += "uk.gov.hmrc.play.bootstrap.HttpClientV2Module"

# Play Modules
play.modules.enabled += "uk.gov.hmrc.operationalmetrics.module.Module"
play.modules.enabled += "uk.gov.hmrc.mongo.play.PlayMongoModule"

# The application languages
# ~~~~~
play.i18n.langs = ["en"]

# Router
# ~~~~~
# Define the Router object to use for this application.
# This router will be looked up first when the application is starting up,
# so make sure this is the entry point.
# Furthermore, it's assumed your route file is named properly.
# So for an application router like `my.application.Router`,
# you may need to define a router file `conf/my.application.routes`.
# Default to Routes in the root package (and conf/routes)
# !!!WARNING!!! DO NOT CHANGE THIS ROUTER
play.http.router = prod.Routes

# Microservice specific config

mongodb {
  uri = "mongodb://localhost:27017/operational-metrics"
}

microservice {
  services {
    artefact-processor {
      host = "localhost"
      port = 9000
    }
  
    service-dependencies {
      host = "localhost"
      port = 8459
    }
    
    releases-api {
      host = "localhost"
      port = 8008
    }

    teams-and-repositories {
      host = "localhost"
      port = 9015
    }
  }
}

service-lead-times-updater.enabled      = false
service-lead-times-updater.interval     = 30.minutes
service-lead-times-updater.initialDelay = 1.second

service-now-mappings-updater.enabled      = true
service-now-mappings-updater.interval     = 30.minutes
service-now-mappings-updater.initialDelay = 1.second

deployment-event-handler {
  allow-list {
    environments = ["production"]
    services     = []
  }
  deny-list {
    services = [
      # PlatOps
      "content-security-policy-reports",
      "file-transfer-stub",
      "file-upload",
      "file-upload-admin-frontend",
      "file-upload-frontend",
      "hello-world-object-store",
      "hello-world-upscan",
      "internal-auth",
      "internal-auth-admin-frontend",
      "internal-auth-frontend",
      "key-store",
      "object-store",
      "object-store-admin-frontend",
      "platform-status-backend",
      "platform-status-consul-backend",
      "platform-status-consul-frontend",
      "platform-status-frontend",
      "platops-example-backend-microservice",
      "platops-example-frontend-microservice",
      "platops-example-private-backend-microservice",
      "save4later",
      "sdes-stub",
      "upscan-initiate",
      "upscan-listener",
      "upscan-notify",

      # Build and Deploy
      "build-and-deploy-canary-service",
      # platform-status-frontend is listed under PlatOps.

      # PlatUI
      "accessibility-statement-frontend",
      "contact-frontend",
      "deskpro-ticket-queue",
      "feedback-frontend",
      "help-frontend",
      "hmrc-deskpro",
      "hmrc-deskpro-admin-frontend",
      "platform-test-example-frontend",
      "platform-ui-admin-frontend",
      "tracking-consent-frontend",

      # PlatUCD
      "platucd-playground-frontend",

      # Telemetry
      "alert-simulator",
      "zone-health"
    ]
  }
}

aws.sqs {          
  enabled = false
  deployment {
    queueUrl            = "https://sqs.eu-west-2.localhost.localstack.cloud:4566/000000000000/mdtp-deployment-events"
    maxNumberOfMessages = 1
    waitTimeSeconds     = 20
  }
}

queue {
  retryInterval = 1 minute
  ttl           = 30 days
}

servicenow {
  url                         = "http://localhost:11111"
  oauth {
    client-id                 = "set-me"
    client-secret             = "set-me"
    expiry-buffer             = 1 minute
  }
  default-cmdb-ci             = "Default"
  repository-yaml-mapping-key = "serviceNowMapping"
}

servicenow-stream {
  enabled = false
  source-tick {
    initialDelay = 1 second
    interval     = 5 seconds
  }
}
